<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TD2 - Skills Claude & Gems Gemini</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .hero-home {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e5aa8 0%, #1a7a3c 100%);
        color: var(--color-white);
        padding: var(--spacing-lg);
      }

      .hero-home-content {
        text-align: center;
        max-width: 600px;
      }

      .hero-home h1 {
        font-size: 3.5rem;
        margin-bottom: var(--spacing-lg);
        font-weight: 700;
        line-height: 1.2;
      }

      .hero-home p {
        font-size: 1.3rem;
        margin-bottom: var(--spacing-xl);
        opacity: 0.95;
        line-height: 1.6;
      }

      .cta-button {
        display: inline-block;
        padding: var(--spacing-md) var(--spacing-lg);
        background-color: var(--color-accent);
        color: var(--color-dark);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: var(--transition);
        box-shadow: 0 4px 15px rgba(242, 169, 46, 0.3);
        border: none;
        cursor: pointer;
      }

      .cta-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(242, 169, 46, 0.4);
        background-color: #f3b857;
      }

      .cta-button:active {
        transform: translateY(-1px);
      }

      .hero-meta {
        margin-top: var(--spacing-xl);
        display: flex;
        justify-content: center;
        gap: var(--spacing-lg);
        flex-wrap: wrap;
        font-size: 0.95rem;
        opacity: 0.85;
      }

      .meta-item {
        display: flex;
        align-items: center;
      }

      .meta-item::before {
        content: "•";
        margin-right: var(--spacing-sm);
        font-size: 1.3rem;
      }

      @media (max-width: 768px) {
        .hero-home h1 {
          font-size: 2.5rem;
        }

        .hero-home p {
          font-size: 1.1rem;
        }

        .hero-meta {
          gap: var(--spacing-sm);
        }

        .meta-item::before {
          display: none;
        }

        .meta-item {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <!-- Contenu principal -->
    <main class="hero-home">
      <div class="hero-home-content">
        <h1>TD2 - Skills Claude & Gems Gemini</h1>
        <p>
          Découvrez, utilisez et créez vos propres workflows IA sur deux
          plateformes : capitalisez vos configurations pour gagner du temps
        </p>
        <a href="TD2-setup.html" class="cta-button">Commencer le TD</a>
        <a
          href="index.html"
          class="cta-button"
          style="
            display: inline-block;
            margin-left: 15px;
            background-color: rgba(242, 169, 46, 0.3);
            border: 2px solid var(--color-accent);
          "
          >Retour à l'accueil</a
        >
        <div class="hero-meta">
          <span class="meta-item">Durée : 1h30</span>
          <span class="meta-item">Niveau : BUT3 MMI</span>
          <span class="meta-item">IUT Béziers</span>
        </div>
      </div>
    </main>
  </body>
</html>
